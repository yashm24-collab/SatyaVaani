<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SatyaVaani &mdash; Signal Analyser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --void:#05090A;
  --panel:#0A1113;
  --panel-lit:#0E181A;
  --grid:#14252A;
  --rule:#1B3035;
  --chrome:#4E6B71;
  --chrome-hi:#7FA3AA;
  --text:#D6E4E6;

  --clear:#3DDC97;
  --verify:#E8B84B;
  --danger:#FF5F56;
  --idle:#3A5257;

  --live:var(--idle);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--void);
  color:var(--text);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  /* ponytail: no overflow:hidden. On a short projector it must scroll,
     not silently amputate the verdict. */
}

/* CRT atmosphere ------------------------------------------------------ */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),
    radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.75) 100%);
  mix-blend-mode:multiply;
}

.rig{
  width:min(1080px,100%);
  background:linear-gradient(180deg,var(--panel-lit),var(--panel));
  border:1px solid var(--rule);
  border-radius:3px;
  box-shadow:0 0 0 1px #000 inset, 0 40px 120px -30px #000;
  opacity:0;transform:translateY(14px);
  animation:rise .7s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes rise{to{opacity:1;transform:none}}

/* header -------------------------------------------------------------- */
.bar{
  display:flex;align-items:center;gap:18px;
  padding:13px 20px;border-bottom:1px solid var(--rule);
}
.mark{
  font-family:Rajdhani,sans-serif;font-weight:700;font-size:19px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--text);
}
.mark span{color:var(--chrome)}
.stat{
  margin-left:auto;display:flex;align-items:center;gap:9px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--chrome);
}
/* Connection state, NOT verdict. Red must mean exactly one thing in this UI,
   and it already means "do not act on this call". */
.led{
  width:7px;height:7px;border-radius:50%;background:var(--chrome-hi);
  box-shadow:0 0 10px 1px var(--chrome-hi);transition:background .4s,box-shadow .4s;
}
.led.off{background:var(--idle);box-shadow:none}

.warn{
  display:none;padding:8px 20px;
  background:rgba(255,95,86,.09);border-bottom:1px solid rgba(255,95,86,.3);
  color:var(--danger);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
}
.warn.on{display:block}

/* scope --------------------------------------------------------------- */
.scope-wrap{position:relative;padding:22px 20px 6px}
canvas{display:block;width:100%;height:230px}
.axis{
  position:absolute;left:20px;top:22px;
  font-size:9px;letter-spacing:.16em;color:var(--chrome);opacity:.65;
}
.axis.r{left:auto;right:20px}

/* evidence ------------------------------------------------------------ */
.evid{display:none;padding:2px 20px 14px}
.evid.on{display:block}
.elab{
  display:flex;justify-content:space-between;
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--chrome);margin-bottom:6px;
}
.elab span{opacity:.55;letter-spacing:.12em}
#heat{
  display:block;width:100%;height:52px;
  border:1px solid var(--rule);image-rendering:auto;
}

/* verdict ------------------------------------------------------------- */
.verdict{padding:20px 20px 26px;border-bottom:1px solid var(--rule)}
.lab{
  font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--chrome);margin-bottom:9px;
}
.action{
  font-family:Rajdhani,sans-serif;font-weight:600;
  font-size:clamp(26px,4.4vw,44px);line-height:1.06;letter-spacing:-.005em;
  color:var(--live);transition:color .45s ease;
  text-shadow:0 0 34px color-mix(in srgb,var(--live) 35%,transparent);
  min-height:1.1em;
}

/* readouts ------------------------------------------------------------ */
.rail{display:grid;grid-template-columns:repeat(4,auto) 1fr;gap:0;align-items:center}
.cell{padding:13px 20px;border-right:1px solid var(--rule)}
.cell .k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--chrome);margin-bottom:4px}
.cell .v{font-size:16px;font-weight:500;color:var(--chrome-hi);font-variant-numeric:tabular-nums}
.cell .v.tint{color:var(--live);transition:color .45s ease}

.hist{padding:13px 20px;display:flex;flex-direction:column;gap:5px}
.hist .k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--chrome)}
.ticks{display:flex;gap:2px;height:15px;align-items:flex-end}
.ticks i{width:4px;height:100%;background:var(--idle);border-radius:1px;opacity:.85}

@media (max-width:720px){
  .rail{grid-template-columns:repeat(2,1fr)}
  .cell{border-bottom:1px solid var(--rule)}
  canvas{height:170px}
}
</style>
</head>
<body>

<div class="rig">
  <div class="bar">
    <div class="mark">Satya<span>Vaani</span></div>
    <div class="stat"><span class="led off" id="led"></span><span id="conn">standby</span></div>
  </div>

  <div class="warn" id="warn">Placeholder scorer active &mdash; not a detector. Do not present these numbers.</div>

  <div class="scope-wrap">
    <div class="axis">INPUT &middot; 2.0 s WINDOW</div>
    <div class="axis r">16 kHz</div>
    <canvas id="scope"></canvas>
  </div>

  <div class="evid" id="evid">
    <div class="elab">Evidence &middot; regions driving the score <span>low &rarr; high freq</span></div>
    <canvas id="heat"></canvas>
  </div>

  <div class="verdict">
    <div class="lab">Verdict</div>
    <div class="action" id="action">Awaiting signal</div>
  </div>

  <div class="rail">
    <div class="cell"><div class="k">P(genuine)</div><div class="v tint" id="score">&mdash;&mdash;</div></div>
    <div class="cell"><div class="k">Band</div><div class="v tint" id="band">idle</div></div>
    <div class="cell"><div class="k">Latency</div><div class="v" id="ms">&mdash;</div></div>
    <div class="cell"><div class="k">Model</div><div class="v" id="model">&mdash;</div></div>
    <div class="hist">
      <div class="k">History</div>
      <div class="ticks" id="ticks"></div>
    </div>
  </div>
</div>

<script>
const COLOR = {
  low:    [0x3D,0xDC,0x97],
  medium: [0xE8,0xB8,0x4B],
  high:   [0xFF,0x5F,0x56],
  none:   [0x3A,0x52,0x57],
};
const N = 128, HIST = 44;

const cv = document.getElementById('scope');
const ctx = cv.getContext('2d');
const ticks = document.getElementById('ticks');
for (let i = 0; i < HIST; i++) ticks.appendChild(document.createElement('i'));

let target = new Array(N).fill(0);   // newest envelope from the server
let shown  = new Array(N).fill(0);   // what we draw, eased toward target
let colNow = COLOR.none.slice();
let colTgt = COLOR.none.slice();
let lastSeq = -1, connected = false;

function size() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', size); size();

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight, mid = h / 2;
  ctx.clearRect(0, 0, w, h);

  // grid
  ctx.strokeStyle = '#14252A'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < 8; i++) { const x = (w / 8) * i; ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  ctx.moveTo(0, mid); ctx.lineTo(w, mid);
  ctx.stroke();

  // ease samples and colour
  for (let i = 0; i < N; i++) shown[i] += (target[i] - shown[i]) * 0.22;
  for (let c = 0; c < 3; c++) colNow[c] += (colTgt[c] - colNow[c]) * 0.08;
  const col = `rgb(${colNow.map(v => Math.round(v)).join(',')})`;

  // mirrored envelope
  const step = w / (N - 1), amp = mid * 0.86;
  ctx.beginPath();
  ctx.moveTo(0, mid - shown[0] * amp);
  for (let i = 1; i < N; i++) ctx.lineTo(i * step, mid - shown[i] * amp);
  for (let i = N - 1; i >= 0; i--) ctx.lineTo(i * step, mid + shown[i] * amp);
  ctx.closePath();

  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, `rgba(${colNow.map(Math.round).join(',')},.16)`);
  g.addColorStop(.5, `rgba(${colNow.map(Math.round).join(',')},.42)`);
  g.addColorStop(1, `rgba(${colNow.map(Math.round).join(',')},.16)`);
  ctx.fillStyle = g; ctx.fill();

  ctx.strokeStyle = col; ctx.lineWidth = 1.4;
  ctx.shadowColor = col; ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;

  requestAnimationFrame(draw);
}
draw();

const HEAT_W = 64, HEAT_H = 24;
const hc = document.getElementById('heat');
const hx = hc.getContext('2d');
const off = document.createElement('canvas');
off.width = HEAT_W; off.height = HEAT_H;
const ox = off.getContext('2d');

function drawHeat(flat) {
  // Intensity of the verdict colour, so the palette stays semantic: the
  // evidence strip is never a different colour from the verdict it explains.
  const img = ox.createImageData(HEAT_W, HEAT_H);
  const [r, g, b] = colTgt;
  for (let i = 0; i < flat.length; i++) {
    const v = flat[i] / 255, j = i * 4;
    img.data[j]     = r * v;
    img.data[j + 1] = g * v;
    img.data[j + 2] = b * v;
    img.data[j + 3] = 255;
  }
  ox.putImageData(img, 0, 0);

  const d = devicePixelRatio || 1, rect = hc.getBoundingClientRect();
  hc.width = rect.width * d; hc.height = rect.height * d;
  hx.imageSmoothingEnabled = true;
  // mel axis runs low->high downward in the array; flip so high freq is on top
  hx.save();
  hx.translate(0, hc.height); hx.scale(1, -1);
  hx.drawImage(off, 0, 0, hc.width, hc.height);
  hx.restore();
}

function pushTick(band) {
  const kids = ticks.children;
  for (let i = 0; i < kids.length - 1; i++)
    kids[i].style.background = kids[i + 1].style.background || '';
  kids[kids.length - 1].style.background =
    `rgb(${COLOR[band].join(',')})`;
}

function setConn(ok) {
  if (ok === connected) return;
  connected = ok;
  document.getElementById('led').classList.toggle('off', !ok);
  document.getElementById('conn').textContent = ok ? 'live' : 'no signal';
}

async function poll() {
  try {
    const r = await fetch('/verdict', {cache: 'no-store'});
    const d = await r.json();
    setConn(true);

    document.getElementById('warn').classList.toggle('on', d.placeholder);
    document.getElementById('model').textContent = d.placeholder ? 'stub' : 'trained';

    if (d.seq !== lastSeq) {
      lastSeq = d.seq;
      target = d.wave;
      colTgt = COLOR[d.band] || COLOR.none;
      document.documentElement.style.setProperty(
        '--live', `rgb(${colTgt.join(',')})`);
      document.getElementById('action').textContent = d.action;
      document.getElementById('score').textContent =
        d.score === null ? '——' : d.score.toFixed(2);
      document.getElementById('band').textContent = d.band;
      const msEl = document.getElementById('ms');
      msEl.textContent = d.ms === null ? '—' : d.ms.toFixed(0) + ' ms';
      msEl.style.color = d.behind ? 'var(--danger)' : '';
      pushTick(d.band);

      const ev = document.getElementById('evid');
      if (d.heat) { ev.classList.add('on'); drawHeat(d.heat); }
      else ev.classList.remove('on');
    }
  } catch (e) {
    setConn(false);
  }
  setTimeout(poll, 150);
}
poll();
</script>
</body>
</html>
